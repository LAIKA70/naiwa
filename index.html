<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#fff3c4; --ink:#2b2414; --yellow:#f6c945; --olive:#8a6a2a; --green:#9cc08a;
  --cream:#fdf0c8; --card:#ffffff; --line:#2b2414; --muted:#6b604a; --pink:#ff6b9a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a12; --ink:#fff4c2; --cream:#24221a; --card:#2c291e; --line:#ffd23f; --muted:#c9bd95;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
h1,h2,h3,.fun{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400;letter-spacing:.02em}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* videos */
.vids{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.vid{background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:5px 5px 0 var(--line)}
.vid .frame{position:relative;aspect-ratio:16/9;background:#2b2414}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .meta{padding:12px 16px 14px}
.vid .meta h3{margin:0;font-size:20px}
.vid .meta p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.vid .meta a{font-size:14px;font-weight:700}
.rating{color:var(--pink);font-weight:900;letter-spacing:1px}

/* ---------- desktop pet ---------- */
:root{--pw:110px;--ph:180px}
@media (max-width:600px){:root{--pw:80px;--ph:132px}}
#pet{position:fixed;left:0;top:0;width:var(--pw);height:var(--ph);z-index:40;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#pet.held{cursor:grabbing}
#pet .body{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
#pet .shadow{position:absolute;left:50%;bottom:-6px;width:70%;height:12px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.18);filter:blur(2px)}
#pet .view{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);display:none}
#pet .view img{position:absolute;pointer-events:none;-webkit-user-drag:none}
#pet .v-front{aspect-ratio:266/440}
#pet .v-front .fl{left:0;top:0;width:100%;height:100%}
#pet .v-front .armL{transform-origin:17.3% 34.1%}
#pet .v-front .armR{transform-origin:82.7% 34.1%}
#pet .v-front .legL{transform-origin:35% 76%}
#pet .v-front .legR{transform-origin:65% 76%}
#pet .pupil{position:absolute;top:8.3%;width:4.6%;aspect-ratio:1;margin:-2.3% 0 0 -2.3%;border-radius:50%;background:#111}
#pet .lid{position:absolute;top:8.3%;width:13.5%;aspect-ratio:1;margin:-6.75% 0 0 -6.75%;border-radius:50%;background:linear-gradient(#ffdb52 0 50%,#3a2a10 50% 57%,#ffdb52 57%);transform:scaleY(0);transform-origin:50% 0;pointer-events:none}
#pet .prop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:calc(var(--ph)*.22);line-height:1;display:none;pointer-events:none}
#pet .v-side{aspect-ratio:199/446}
#pet .v-side .torso,#pet .v-side .arm{left:0;top:0;width:100%;height:100%}
#pet .v-side .arm{transform-origin:56.3% 35.9%}
#pet .v-side .leg{position:absolute;left:0;top:71.3%;width:100%;height:28.7%;transform-origin:49.2% 3.1%}
#pet .v-side .leg img,#pet .v-side .shin{position:absolute;left:0;top:0;width:100%;height:100%}
#pet .v-side .shin{transform-origin:51.8% 50%}
#pet .v-side .leg.far{filter:brightness(.78)}
#pet .v-back{aspect-ratio:275/443}#pet .v-back img{left:0;top:0;width:100%;height:100%}
#pet .v-clip{pointer-events:none}
#pet .bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:#fff;color:#2b2414;border:2px solid #2b2414;border-radius:12px;padding:2px 10px;font-family:"ZCOOL KuaiLe";font-size:16px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#pet .bubble.show{opacity:1}
.zzz,.fx{position:fixed;z-index:41;pointer-events:none;font-family:"ZCOOL KuaiLe";color:#2b2414;font-size:20px;animation:zz 2.2s ease-out forwards}
.fx{animation:fx 1s ease-out forwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(30px,-70px) scale(1.3)}}
@keyframes fx{0%{opacity:1;transform:translate(0,0) scale(.7)}100%{opacity:0;transform:translate(var(--dx,0),-50px) scale(1.4)}}
#petToggle,#soundTip{position:fixed;right:14px;bottom:14px;z-index:45;font-family:"ZCOOL KuaiLe";font-size:15px;background:var(--yellow);color:#2b2414;border:2px solid #2b2414;border-radius:999px;padding:4px 12px;box-shadow:3px 3px 0 #2b2414;cursor:pointer}
#soundTip{bottom:56px;background:#fff;animation:tip 1.2s ease-in-out infinite alternate}
@keyframes tip{to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.marquee div{animation:none}.burst{display:none}}

.burst{position:fixed;pointer-events:none;font-family:"ZCOOL KuaiLe";font-weight:900;color:#2b2414;z-index:50;animation:fly 1.3s ease-out forwards;white-space:nowrap}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--r))}}
header.top{padding:48px 0 8px}
header.top h1{font-size:clamp(40px,8vw,72px);margin:0;line-height:1.1}
header.top p{margin:6px 0 0;color:var(--muted)}
#videos{padding:24px 0 240px}
</style>

<body>

<div id="pet" aria-label="奶蛙桌宠，点击它会狂笑"><div class="shadow"></div><div class="body">
  <div class="view v-front">

<script>
let count=0; const cEl={textContent:0};
// ---------- videos ----------
const VIDEOS = [
  {bv:"BV1JBuB6PEMF", t:"奶蛙大笑（额外扩展版）", d:"核心技能完整版，建议外放。", r:5},
  {bv:"BV1Y1uo63Edn", t:"东京食奶蛙", d:"当奶蛙闯进东京喰种。", r:5},
  {bv:"BV1e6x56aEJN", t:"再见了，所有的奶蛙", d:"One Last Kiss × 奶蛙，莫名破防。", r:4},
  {bv:"BV14XaJ6nEjS", t:"奶蛙你给我拿好了呀", d:"一句台词，循环到天荒地老。", r:4},
  {bv:"BV1Ldar6ZEhk", t:"老外看奶蛙能绷住多久？", d:"跨文化抗笑挑战。", r:4},
  {bv:"BV1Gzxy61EjX", t:"奶蛙表情包正在走向国际", d:"抽象无国界。", r:3},
  {bv:"BV1XAd9BLE41", t:"奶蛙是从哪来的？", d:"考古向，适合正经了解一下。", r:3},
  {bv:"BV1er3x68EZT", t:"奶蛙最全起源说法考究", d:"深度考据，越看越怪。", r:3},
];
const vbox = document.getElementById('vids');
VIDEOS.forEach(v=>{
  const el = document.createElement('div'); el.className='vid';
  el.innerHTML = `<div class="frame"><iframe loading="lazy" allowfullscreen
      src="https://player.bilibili.com/player.html?bvid=${v.bv}&page=1&autoplay=0&high_quality=1&danmaku=0"
      title="${v.t}"></iframe></div>
    <div class="meta"><h3>${v.t}</h3><p>${v.d}</p>
    <p><span class="rating">${'🤣'.repeat(v.r)}</span> · <a href="https://www.bilibili.com/video/${v.bv}/" target="_blank" rel="noopener">去 B 站看 ↗</a></p></div>`;
  vbox.appendChild(el);
});

// ---------- desktop pet ----------
(function(){
  const pet=document.getElementById('pet'), body=pet.querySelector('.body'), bub=document.getElementById('petBubble');
  const V={front:pet.querySelector('.v-front'),side:pet.querySelector('.v-side'),clip:pet.querySelector('.v-clip')};
  const F={aL:V.front.querySelector('.armL'),aR:V.front.querySelector('.armR'),pupils:V.front.querySelectorAll('.pupil'),lids:V.front.querySelectorAll('.lid')};
  const S={near:V.side.querySelector('.leg.near'),far:V.side.querySelector('.leg.far'),arm:V.side.querySelector('.arm')};
  S.nearShin=S.near.querySelector('.shin'); S.farShin=S.far.querySelector('.shin');

  // ----- sounds (browsers only allow sound after the first tap on the page) -----
  const SND={laugh:new Audio('assets/laugh.mp3'),battle:new Audio('assets/battle.mp3')};
  for(const k in SND) SND[k].preload='auto';
  let unlocked=false;
  function unlock(){ if(unlocked) return; unlocked=true;
    for(const k in SND){ const a=SND[k]; a.muted=true; a.play().then(()=>{ if(!a._want){a.pause();a.currentTime=0;} a.muted=false; }).catch(()=>{a.muted=false}); }
    const b=document.getElementById('soundTip'); if(b) b.remove(); }
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{once:true,passive:true}));
  function stopAudio(){ for(const k in SND){ SND[k]._want=false; try{SND[k].pause()}catch(e){} } }
  function play(name){ stopAudio(); const a=SND[name]; a._want=true; a.muted=false; try{ a.currentTime=0; a.volume=1; a.play().catch(()=>{}); }catch(e){} }

  // ----- transparent video clips: "stacked alpha" mp4 (colour on top, matte below), drawn to a canvas on every decoded frame -----
  const cv=V.clip, cx=cv.getContext('2d',{willReadFrequently:true}), off=document.createElement('canvas'), ox=off.getContext('2d',{willReadFrequently:true});
  function makeClip(src,w,h,height){ const v=document.createElement('video'); v.src=src; v.muted=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto'; v.load(); return {v,w,h,height}; }
  const CLIPS={laugh:makeClip('assets/laugh.mp4',260,360,1.08),battle:makeClip('assets/battle.mp4',442,360,1.148)};
  let cur=null, img=null;
  function drawClip(){
    if(!cur) return; const {v,w,h}=cur;
    if(v.readyState>=2){
      ox.drawImage(v,0,0,w,h*2);
      const src=ox.getImageData(0,0,w,h*2).data, d=img.data, n=w*h*4;
      for(let i=0;i<n;i+=4){ d[i]=src[i]; d[i+1]=src[i+1]; d[i+2]=src[i+2]; d[i+3]=src[n+i]; }
      cx.putImageData(img,0,0);
    }
    if(!v.paused && !v.ended){ if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(drawClip); else requestAnimationFrame(drawClip); }
  }
  function startClip(name){
    stopClip(); cur=CLIPS[name]; const {v,w,h,height}=cur;
    cv.width=w; cv.height=h; off.width=w; off.height=h*2; img=cx.createImageData(w,h); cx.clearRect(0,0,w,h);
    cv.style.height=(height*100)+'%'; cv.style.aspectRatio=w+'/'+h;
    try{ v.currentTime=0; }catch(e){} v.play().then(drawClip).catch(()=>{}); drawClip();
  }
  function stopClip(){ if(cur){ try{cur.v.pause()}catch(e){} cur=null; } }

  const W=()=>pet.offsetWidth, H=()=>pet.offsetHeight, ground=()=>innerHeight-H()-14;
  const now=()=>performance.now(), rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  let x=rand(0,innerWidth-W()), y=ground(), vx=0, vy=0, dir=-1, view='', state='idle', t0=now(), until=0, targetX=null, hidden=false, phase=0;
  let mx=innerWidth/2, my=innerHeight/2, nextBlink=now()+3000;
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
  addEventListener('touchstart',e=>{const t=e.touches[0]; if(t){mx=t.clientX;my=t.clientY}},{passive:true});

  function setView(v){ if(view===v) return; view=v; for(const k in V) V[k].style.display=k===v?'block':'none'; }
  function say(txt,ms=1400){ bub.textContent=txt; bub.classList.add('show'); clearTimeout(say.t); say.t=setTimeout(()=>bub.classList.remove('show'),ms); }
  function go(st,dur){ if((state==='laugh'||state==='battle')&&st!=='laugh'&&st!=='battle'){ stopClip(); stopAudio(); } state=st; t0=now(); until=t0+dur; }
  function burst(n){
    const r=pet.getBoundingClientRect();
    for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='burst';
      s.textContent=pick(['哈哈哈','哦齁齁齁','嘎嘎嘎','哈哈哈哈哈','绷不住了','笑死','🤣']);
      s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+r.height*0.25)+'px'; s.style.fontSize=(14+Math.random()*18)+'px';
      const a=-Math.PI*Math.random(), d=60+Math.random()*120;
      s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px'); s.style.setProperty('--r',(Math.random()*60-30)+'deg');
      document.body.appendChild(s); setTimeout(()=>s.remove(),1400); }
  }

  // ----- the two actions -----
  function laugh(byUser){ go('laugh',6200); setView('clip'); bub.classList.remove('show'); startClip('laugh'); play('laugh'); burst(byUser?6:3); }
  function battle(){ go('battle',12900); setView('clip'); bub.classList.remove('show'); startClip('battle'); play('battle'); }
  window.petLaugh=()=>{ if(!hidden) laugh(true); };
  window.petBattle=()=>{ if(!hidden) battle(); };

  function startWalk(){ if(targetX===null) targetX=rand(0,innerWidth-W()); dir=targetX>x?1:-1; go('walk',99999); }
  function next(){
    const r=Math.random();
    if(r<0.50){ targetX=rand(0,innerWidth-W()); startWalk(); }
    else if(r<0.72) go('idle',rand(1800,3500));
    else if(r<0.86) laugh(false);
    else battle();
  }
  function resume(){ if(targetX!==null && Math.abs(targetX-x)>4) startWalk(); else next(); }

  // ----- click = laugh (interrupts anything), drag = pick up -----
  let down=null, held=false, last=null;
  pet.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,ox:e.clientX-x,oy:e.clientY-y}; last={x:e.clientX,y:e.clientY,t:now()}; pet.setPointerCapture(e.pointerId); e.preventDefault(); });
  pet.addEventListener('pointermove',e=>{
    if(!down) return;
    if(!held && Math.hypot(e.clientX-down.x,e.clientY-down.y)>6){ held=true; stopClip(); stopAudio(); pet.classList.add('held'); state='held'; say(pick(['放我下来！','呱！？','啊啊啊']),99999); }
    if(held){ const t=now(), dt=Math.max(1,t-last.t); vx=(e.clientX-last.x)/dt*16; vy=(e.clientY-last.y)/dt*16; last={x:e.clientX,y:e.clientY,t}; x=e.clientX-down.ox; y=e.clientY-down.oy; }
  });
  function release(){ if(!down) return;
    if(held){ held=false; pet.classList.remove('held'); bub.classList.remove('show'); state='fall'; }
    else { laugh(true); count++; cEl.textContent=count; try{localStorage.setItem('naiwa-count',count)}catch(e){} }
    down=null; }
  pet.addEventListener('pointerup',release); pet.addEventListener('pointercancel',release);

  function front(aL,aR,lid,track){
    F.aL.style.transform=`rotate(${aL}deg)`; F.aR.style.transform=`rotate(${aR}deg)`;
    F.lids.forEach(l=>l.style.transform=`scaleY(${lid})`);
    const fr=V.front.getBoundingClientRect(), w=fr.width, m=w*0.017;
    F.pupils.forEach((p,i)=>{ let dx=0,dy=0;
      if(track){ const ex=fr.left+w*(i?0.606:0.401), ey=fr.top+fr.height*0.083, ddx=mx-ex, ddy=my-ey, d=Math.hypot(ddx,ddy)||1, k=Math.min(1,d/120); dx=ddx/d*m*k; dy=ddy/d*m*k; }
      p.style.transform=`translate(${dx}px,${dy}px)`; });
  }

  let prev=now();
  function frame(t){
    const dt=Math.min(50,t-prev)/1000; prev=t; const e=(t-t0)/1000, g=ground();
    let sx=1, sy=1, rot=0, ty=0, flip=1, aL=0, aR=0, lid=0;
    if(t>nextBlink){ if(t>nextBlink+130) nextBlink=t+rand(2200,5000); else lid=1; }
    const br=Math.sin(t/1000*2.6);
    switch(state){
      case 'idle': setView('front'); sy=1+br*0.012; sx=1-br*0.008; aL=1.5+br*1.5; aR=-aL; if(t>until) next(); break;
      case 'gaze': setView('front'); sy=1+br*0.012; aL=1.5; aR=-1.5; if(e>0.25&&e<0.27) say(pick(['👀','？','看我干嘛','呱？']),1200); if(t>until) resume(); break;
      case 'walk': {
        setView('side'); flip=dir>0?-1:1;            // side art faces left
        x+=dir*55*dt; phase+=dt*7;
        for(const [leg,shin,ph] of [[S.near,S.nearShin,phase],[S.far,S.farShin,phase+Math.PI]]){
          leg.style.transform=`rotate(${Math.sin(ph)*24}deg)`; shin.style.transform=`rotate(${-Math.max(0,Math.cos(ph))*40}deg)`; }
        S.arm.style.transform=`rotate(${-Math.sin(phase)*18}deg)`;
        ty=-Math.abs(Math.cos(phase))*5; rot=-2+Math.sin(phase*2)*1.2;
        if(Math.random()<dt*0.09){ go('gaze',rand(1400,2400)); break; }      // stop and look at you
        if(Math.random()<dt*0.05){ laugh(false); break; }                   // burst out laughing mid-walk
        if(Math.random()<dt*0.02){ battle(); break; }                       // enter battle mode mid-walk
        if((dir>0&&x>=targetX)||(dir<0&&x<=targetX)){ x=targetX; targetX=null; next(); }
        break; }
      case 'laugh': case 'battle':
        setView('clip'); flip=(state==='laugh'&&dir>0)?-1:1;
        if(state==='laugh'&&Math.random()<dt*2) burst(1);
        if(t>until || (cur&&cur.v.ended)){ stopClip(); resume(); }
        break;
      case 'held': setView('front'); rot=Math.max(-30,Math.min(30,vx*2)); sy=1.06; sx=0.95; ty=Math.sin(t/60)*1.5; aL=50+Math.sin(t/70)*30; aR=-50-Math.sin(t/70+1)*30; break;
      case 'fall': setView('front'); aL=100; aR=-100;
        vy+=1800*dt; x+=vx*60*dt; y+=vy*dt; vx*=0.98; rot=vx*1.5;
        if(x<0){x=0;vx=-vx*0.5} if(x>innerWidth-W()){x=innerWidth-W();vx=-vx*0.5}
        if(y>=g){ y=g; if(vy>500){ vy=-vy*0.35; say(pick(['哎哟','呱！','好疼'])); } else { vy=0; vx=0; go('land',350); } }
        break;
      case 'land': setView('front'); { const p=Math.min(1,e/0.35); sy=0.78+0.22*p; sx=1.22-0.22*p; aL=30*(1-p); aR=-aL; } if(t>until) next(); break;
    }
    if(state!=='held'&&state!=='fall') y+=(g-y)*0.3;
    if(view==='front') front(aL,aR,lid,state!=='fall');
    x=Math.max(0,Math.min(innerWidth-W(),x));
    pet.style.transform=`translate(${x}px,${y}px)`;
    body.style.transform=`translateY(${ty}px) rotate(${rot}deg) scale(${sx*flip},${sy})`;
    if(!hidden) requestAnimationFrame(frame);
  }
  setView('front'); go('idle',1500); requestAnimationFrame(frame);
  addEventListener('resize',()=>{ if(state!=='held') y=ground(); });
  const q=new URLSearchParams(location.search).get('pet'); if(q) setTimeout(()=>{ if(q==='walk'){targetX=x>innerWidth/2?20:innerWidth-W()-20;startWalk();} else if(q==='laugh') laugh(false); else if(q==='battle') battle(); },300);
  const tg=document.getElementById('petToggle');
  tg.onclick=()=>{ hidden=!hidden; pet.style.display=hidden?'none':''; tg.textContent=hidden?'🐸 召唤奶蛙':'🐸 收起奶蛙';
    if(hidden){ stopClip(); stopAudio(); } else { prev=now(); y=-H(); vx=0; vy=0; x=rand(0,innerWidth-W()); targetX=null; state='fall'; requestAnimationFrame(frame); } };
})();
</script>
</body>
</html>
